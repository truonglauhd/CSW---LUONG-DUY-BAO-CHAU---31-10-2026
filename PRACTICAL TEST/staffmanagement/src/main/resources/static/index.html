
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FPT Employee Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #1e3a5f;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: end;
        }

        .form-group {
            flex: 1;
            min-width: 180px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .edit-button {
            background: #d97706;
            padding: 7px 12px;
        }

        .edit-button:hover {
            background: #b45309;
        }

        .secondary-button {
            background: #64748b;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 25px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .form-group {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FPT Employee Management System</h1>

    <p class="subtitle">
        Employee Information Management
    </p>

    <div id="message" class="message"></div>

    <!-- Employee List -->
    <div class="card">

        <h2>Employee List</h2>

        <button onclick="loadEmployees()">
            Refresh Employees
        </button>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Salary</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">

                    <tr>
                        <td colspan="4" class="empty">
                            Loading employees...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- Add / Update Employee -->
    <div class="card">

        <h2 id="formTitle">Add Employee</h2>

        <form id="employeeForm">

            <input type="hidden" id="employeeId">

            <div class="form-row">

                <div class="form-group">

                    <label for="employeeName">
                        Employee Name
                    </label>

                    <input
                        type="text"
                        id="employeeName"
                        placeholder="Enter employee name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="employeeSalary">
                        Salary
                    </label>

                    <input
                        type="number"
                        id="employeeSalary"
                        min="0"
                        step="0.01"
                        placeholder="Enter salary"
                        required
                    >

                </div>

                <div class="form-actions">

                    <button type="submit" id="submitButton">
                        Add Employee
                    </button>

                    <button
                        type="button"
                        class="secondary-button"
                        id="cancelButton"
                        onclick="resetForm()"
                        style="display:none"
                    >
                        Cancel
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

<script>

    const API_URL = "/api/employees";

    // Display messages
    function showMessage(message, type) {

        const element = document.getElementById("message");

        element.textContent = message;
        element.className = "message " + type;
        element.style.display = "block";

    }

    // Handle API errors
    async function getErrorMessage(response) {

        try {

            const data = await response.json();

            return data.message || "Something went wrong";

        } catch {

            return "Request failed: " + response.status;

        }

    }

    // 1. Retrieve all employees
    async function loadEmployees() {

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error(await getErrorMessage(response));
            }

            const employees = await response.json();

            const table = document.getElementById("employeeTable");

            table.innerHTML = "";

            if (employees.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="4" class="empty">
                            No employees found.
                        </td>
                    </tr>
                `;

                return;

            }

            employees.forEach(employee => {

                const row = document.createElement("tr");

                const values = [
                    employee.id,
                    employee.name,
                    Number(employee.salary).toFixed(2)
                ];

                values.forEach(value => {

                    const cell = document.createElement("td");

                    cell.textContent = value;

                    row.appendChild(cell);

                });

                const actionCell = document.createElement("td");

                const editButton = document.createElement("button");

                editButton.textContent = "Edit";

                editButton.className = "edit-button";

                editButton.onclick = () => editEmployee(employee);

                actionCell.appendChild(editButton);

                row.appendChild(actionCell);

                table.appendChild(row);

            });

        } catch (error) {

            showMessage(error.message, "error");

        }

    }

    // 2. Add or update employee
    document.getElementById("employeeForm")
        .addEventListener("submit", async function(event) {

        event.preventDefault();

        const id = document.getElementById("employeeId").value;

        const employee = {

            name: document.getElementById("employeeName").value.trim(),

            salary: Number(
                document.getElementById("employeeSalary").value
            )

        };

        if (
            !employee.name ||
            !Number.isFinite(employee.salary) ||
            employee.salary < 0
        ) {

            showMessage("Please enter valid employee information.", "error");

            return;

        }

        const isUpdating = id !== "";

        let url = API_URL;

        let method = "POST";

        if (isUpdating) {

            employee.id = Number(id);

            method = "PUT";

        }

        try {

            const response = await fetch(url, {

                method: method,

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(employee)

            });

            if (!response.ok) {

                throw new Error(await getErrorMessage(response));

            }

            if (isUpdating) {

                showMessage("Employee updated successfully!", "success");

            } else {

                showMessage("Employee added successfully!", "success");

            }

            resetForm();

            await loadEmployees();

        } catch (error) {

            showMessage(error.message, "error");

        }

    });

    // 3. Load employee information into the form
    function editEmployee(employee) {

        document.getElementById("employeeId").value = employee.id;

        document.getElementById("employeeName").value = employee.name;

        document.getElementById("employeeSalary").value = employee.salary;

        document.getElementById("formTitle").textContent =
            "Update Employee #" + employee.id;

        document.getElementById("submitButton").textContent =
            "Update Employee";

        document.getElementById("cancelButton").style.display =
            "inline-block";

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

    }

    // Reset form
    function resetForm() {

        document.getElementById("employeeForm").reset();

        document.getElementById("employeeId").value = "";

        document.getElementById("formTitle").textContent =
            "Add Employee";

        document.getElementById("submitButton").textContent =
            "Add Employee";

        document.getElementById("cancelButton").style.display =
            "none";

    }

    // Load employees when page opens
    loadEmployees();

</script>

</body>

</html>
